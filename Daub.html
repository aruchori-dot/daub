<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* layout: one ruled notebook page. the game runs on its lines, and every menu is written on the same lines.
     two hands write on it: the player's blue pen and a teacher's red pen */
  --paper: #fbfcfe;
  --rule: #b3cbe9;
  --margin: #e2667a;
  --ink: #2440b6;
  --pencil: #4a4c56;
  --red: #d22f41;
  --green: #15875a;
  --star: #ffd73a;
  --hole: #1c1d24;
  --gold: #c99400;
  --w1: #2440b6; --w2: #15875a; --w3: #7b3fc4;
  --hover: #eef2fc; --veil: rgba(251, 252, 254, 0.93); --next-hover: #1b3193; --on-world: #fbfcfe;
  --font-hand: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Segoe Print", cursive;
  --font-teacher: "Covered By Your Grace", "Gochi Hand", "Segoe Script", "Bradley Hand", cursive;
  --line: 44px;
  --gutter: 64px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #0b0c12; --rule: #1d2f4a; --margin: #ff2d78; --ink: #3ee8ff; --pencil: #d6dbf2;
  --red: #ff3b5c; --green: #39ff88; --star: #ffe14a; --hole: #000000; --gold: #ffe14a;
  --w1: #3ee8ff; --w2: #39ff88; --w3: #b86bff;
  --hover: #161b28; --veil: rgba(11, 12, 18, 0.93); --next-hover: #22b8cc; --on-world: #0b0c12;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--pencil);
  font-family: var(--font-hand); font-size: 19px;
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#stage { position: relative; height: 100%; overflow: hidden; touch-action: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

button, label { font: inherit; color: inherit; cursor: pointer; }
button { background: none; border: 0; padding: 0; margin: 0; }
:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

/* ---- heads-up line while playing ---- */
#hud {
  position: absolute; top: 0; inset-inline: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 8px 16px; pointer-events: none; font-size: 25px; line-height: 1.2;
}
#hud-name { color: var(--ink); }
[data-theme="dark"] h1, [data-theme="dark"] #hud-name, [data-theme="dark"] .level, [data-theme="dark"] .grade, [data-theme="dark"] #hud-deaths { text-shadow: 0 0 8px currentColor; }
[data-theme="dark"] #game { filter: drop-shadow(0 0 2px rgba(120, 230, 255, 0.35)); }
#hud .end { display: flex; align-items: center; gap: 16px; }
#hud-stars { color: var(--gold); font-family: sans-serif; font-size: 20px; letter-spacing: 2px; }
#hud-deaths { color: var(--red); font-family: var(--font-teacher); font-size: 27px; font-variant-numeric: tabular-nums; }
#btn-menu { pointer-events: auto; min-height: 40px; padding: 2px 14px; }

.pen-box {
  border: 2px solid currentColor; color: var(--ink); background: var(--paper);
  border-radius: 255px 14px 225px 14px / 14px 225px 14px 255px;
  font-family: var(--font-hand); font-size: 24px; line-height: 1.2;
}
.pen-box:hover { background: var(--hover); }
.pen-box:active { transform: translateY(1px); }

/* ---- the first page ---- */
#menu { position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y; background: var(--paper); }
.sheet {
  position: relative; min-height: 100%;
  padding: var(--line) 20px var(--line) calc(var(--gutter) + 18px);
  background-image: linear-gradient(to bottom, transparent calc(var(--line) - 1.5px), var(--rule) calc(var(--line) - 1.5px));
  background-size: 100% var(--line);
}
.sheet::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: var(--gutter); width: 6px;
  border-inline: 1.5px solid var(--margin);
}
.sheet > * { max-width: 520px; }
h1 {
  margin: 0; font-weight: 400; color: var(--ink); white-space: nowrap; width: fit-content;
  font-size: 74px; line-height: calc(var(--line) * 2); height: calc(var(--line) * 2);
}
h1 svg { display: block; width: 0; min-width: 100%; height: 14px; margin-top: -20px; overflow: visible; }
.how { margin: 0; line-height: var(--line); text-wrap: balance; }
#levels { list-style: none; margin: var(--line) 0 0; padding: 0; display: flex; flex-wrap: wrap; column-gap: 10px; }
#levels li { display: flex; flex-direction: column; align-items: center; width: 52px; height: calc(var(--line) * 2); }
#worlds { list-style: none; margin: var(--line) 0 0; padding: 0; display: flex; gap: clamp(8px, 2.4vw, 14px); }
#worlds li { flex: 1 1 0; max-width: 176px; min-width: 0; }
.world {
  position: relative; width: 100%; aspect-ratio: 7 / 10; height: auto; padding: 10px 8px; text-align: start;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
  border: 2.4px solid var(--wc); color: var(--on-world); background: var(--wc);
  border-radius: 6px 14px 8px 12px / 12px 6px 14px 8px; box-shadow: 0 0 12px -2px var(--wc), inset 0 0 18px -8px var(--wc);
}
#worlds li:nth-child(2n) .world { transform: rotate(1.2deg); }
.world.w1 { --wc: var(--w1); } .world.w2 { --wc: var(--w2); } .world.w3 { --wc: var(--w3); }
.world::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 0; border-left: 2px solid var(--on-world); opacity: 0.45; }
.wn { position: absolute; top: 6px; right: 12px; font-size: 60px; line-height: 1; }
.wt { font-size: 21px; line-height: 1.05; padding-inline-start: 18px; }
.wp { font-family: var(--font-teacher); font-size: clamp(13px, 3.8vw, 18px); line-height: 1.1; white-space: nowrap; color: var(--on-world); padding-inline-start: clamp(12px, 3.6vw, 18px); }
.world.locked { opacity: 0.4; cursor: default; box-shadow: none; }
.world:not(.locked):active { transform: translateY(1px); }
#menu-back { margin-inline-end: 10px; }
#btn-skins { margin-inline-start: 8px; }
#skins h3 { margin: 6px 0 0; font-weight: 400; font-size: 26px; color: var(--ink); line-height: var(--line); }
#skin-big { display: block; width: 120px; height: 120px; margin-top: 4px; }
.skin-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.skin { width: 86px; height: 96px; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 2px solid var(--rule); border-radius: 10px 6px 12px 7px; background: var(--paper); color: var(--pencil); }
.skin.on { border-color: var(--ink); box-shadow: 0 0 10px -2px var(--ink); }
.skin.locked { opacity: 0.45; cursor: default; }
.skin-cv { width: 56px; height: 56px; }
.skin-nm { font-size: 16px; line-height: 1.05; text-align: center; }
.skin.locked .skin-nm { font-family: var(--font-teacher); color: var(--red); }
#done-stars { margin: 0; font-size: 40px; line-height: 1; color: var(--gold); letter-spacing: 4px; }
#done-new { color: var(--green); font-size: 22px; min-height: 0; }
#done-new:empty { display: none; }
.level {
  width: 52px; height: 52px; margin-top: 4px;
  border: 2.2px solid var(--ink); border-radius: 52% 46% 54% 47% / 47% 54% 46% 53%;
  font-size: 34px; line-height: 1; color: var(--ink); background: var(--paper);
}
#levels li:nth-child(even) .level { border-radius: 46% 54% 47% 52% / 54% 46% 53% 47%; transform: rotate(-3deg); }
.level.boss + .mark.lbl { font-family: var(--font-teacher); font-size: 20px; color: var(--red); }
.level.boss { display: inline-flex; align-items: center; justify-content: center; border-color: var(--red); color: var(--red); box-shadow: 0 0 12px -2px var(--red); }
.level:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
.level:hover { background: var(--hover); }
.level:active { transform: translateY(1px); }
.mark {
  height: 28px; line-height: 28px; white-space: nowrap;
  font-family: var(--font-teacher); font-size: 21px; color: var(--gold); letter-spacing: 1px; font-family: sans-serif; font-size: 17px; transform: rotate(-4deg);
}
.blot { display: inline-block; width: 9px; height: 8px; margin-inline-start: 3px; background: var(--ink); border-radius: 55% 45% 50% 60%; }
.foot { margin: var(--line) 0 0; line-height: var(--line); display: flex; flex-wrap: wrap; column-gap: 22px; align-items: center; }
.foot label { display: inline-flex; align-items: center; gap: 8px; font-size: 24px; color: var(--ink); min-height: 40px; }
.foot input { width: 20px; height: 20px; accent-color: var(--ink); margin: 0; }
.note { line-height: var(--line); font-size: 17px; }

/* ---- the teacher's note after a level ---- */
#done {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: var(--veil); overflow-y: auto; touch-action: pan-y;
}
.grade { width: min(400px, 100%); transform: rotate(-2deg); color: var(--red); font-family: var(--font-teacher); }
.grade h2 { margin: 0; font-weight: 400; font-size: 66px; line-height: 1.05; text-wrap: balance; }
.grade h2 svg { width: 62px; height: 62px; vertical-align: -12px; margin-inline-end: 8px; overflow: visible; }
.grade p { margin: 4px 0 0; font-size: 30px; line-height: 1.25; }
#done-name { color: var(--pencil); font-family: var(--font-hand); font-size: 26px; }
#done-stats { font-variant-numeric: tabular-nums; }
.grade .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.grade .row button { min-height: 46px; padding: 4px 18px; }
#btn-next { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#btn-next:hover { background: var(--next-hover); }

@media (max-width: 440px) { :root { --gutter: 40px; } }
@media (max-height: 430px) {
  :root { --line: 38px; }
  .sheet { padding-top: 0; padding-bottom: 0; }
  h1 { font-size: 56px; }
  #levels, .foot { margin-top: 0; }
  .grade h2 { font-size: 50px; }
  .grade .row { margin-top: 12px; }
}
@media (prefers-reduced-motion: reduce) { .pen-box:active, .level:active { transform: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="A notebook page with an obstacle course. Tap anywhere to jump."></canvas>

  <div id="hud" hidden>
    <span id="hud-name"></span>
    <span class="end">
      <span id="hud-stars" hidden></span>
      <span id="hud-deaths"></span>
      <button type="button" id="btn-menu" class="pen-box">Levels</button>
    </span>
  </div>

  <main id="menu">
    <div class="sheet">
      <h1>Daub
        <svg viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 8 C 40 2, 62 13, 104 7 S 180 2, 220 8 S 276 10, 297 5" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
      </h1>
      <p class="how"><button type="button" id="menu-back" class="pen-box" hidden>&larr; Worlds</button> <span id="menu-sub"></span> <button type="button" id="btn-skins" class="pen-box">Doodle</button> <button type="button" id="btn-endless" class="pen-box">Endless</button></p>
      <ol id="worlds"></ol>
      <ol id="levels" hidden></ol>
      <div id="skins" hidden>
        <canvas id="skin-big" aria-hidden="true"></canvas>
        <h3>Hats</h3><ol id="hats" class="skin-list"></ol>
        <h3>Pens</h3><ol id="pens" class="skin-list"></ol>
      </div>
      <p class="foot">
        <label for="sound"><input type="checkbox" id="sound" checked> Sound</label>
        <label for="music"><input type="checkbox" id="music" checked> Music</label>
        <label for="dark"><input type="checkbox" id="dark"> Dark mode</label>
        <span class="note">On a computer: Space to jump.<br>Tip: turn your phone sideways to see what's coming.</span>
      </p>
    </div>
  </main>

  <section id="done" hidden>
    <div class="grade">
      <h2><svg viewBox="0 0 62 62" aria-hidden="true"><path d="M31 5 C 12 4, 4 18, 6 33 S 22 59, 37 56 S 60 40, 56 24 S 42 3, 24 7" fill="none" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round"/><path d="M19 32 L 28 42 L 45 19" fill="none" stroke="var(--red)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="done-title">Passed!</span></h2>
      <p id="done-name"></p>
      <p id="done-stars"></p>
      <p id="done-stats"></p>
      <p id="done-new"></p>
      <div class="row">
        <button type="button" id="btn-next" class="pen-box">Next level</button>
        <button type="button" id="btn-again" class="pen-box">Again</button>
        <button type="button" id="btn-list" class="pen-box">Levels</button>
      </div>
    </div>
  </section>
</div>
<script>
/* Engine: deterministic fixed-step physics. No DOM. Works in browser (window.Engine) and Node.

   Map characters
   # solid            ^ floor spikes       v ceiling spikes
   S spring           L low launcher (folded corner)
   ) (  wall bouncers            a-e teleport in -> A-E out
   U flip gravity up  N flip gravity back down
   O jump ring (tap while touching it)
   = pencil line: a thin platform that erases shortly after you land on it
   u glue (only a low jump from it)
   * a star to collect (three in a level; they count only in the run that reaches the finish)
   + speed pad (run over it for a short burst of speed)
   > <  one-way gates (the arrow shows the only direction that may pass)
   k button -> erases g tiles        q button -> erases r tiles
   R moving ruler     K compass      J scissors     M stapler      (settings in def.params, in left-to-right order)
   ! ink drip (boss 3)
   H two of them mark opposite corners of a highlighter zone (weak gravity inside)
   P start   F finish   1-9 text anchors
   Trap twins, same look and behaviour, used only by the tests: T spring, I launcher, ] [ bouncers, w-z teleports, V flip, Q ring */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var T = 40;
  var CFG = {
    dt: 1 / 120,
    speed: 300,
    gravity: 2300,
    fallMult: 1.15,
    maxFall: 900,
    jumpV: 750,
    cutV: 300,
    springV: 1060,
    launchV: 800,
    bounceV: 780,
    glueV: 430,
    boostMult: 1.5, boostT: 132,
    zoneG: 0.45,
    coyote: 0.08,
    buffer: 0.1,
    pw: 22,
    ph: 34,
    padW: 10,
    stepUp: 8,
    headNudge: 6,
    vanish: 42,      // ticks a pencil line survives after the first touch
    plankH: 8
  };

  var TELE_IN = 'abcdewxyz';
  var ARM_AT = [0.35, 0.58, 0.8, 1];

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function tri(u) { return (1 - Math.cos(2 * Math.PI * u)) / 2; }

  function parseLevel(def) {
    var rows = def.map.slice();
    var w = 0, i, r, c, ch;
    for (i = 0; i < rows.length; i++) w = Math.max(w, rows[i].length);
    for (i = 0; i < rows.length; i++) while (rows[i].length < w) rows[i] += ' ';
    var L = {
      id: def.id, texts: def.texts || {}, needs: def.needs || [],
      rows: rows, w: w, h: rows.length,
      start: { c: 1, r: 1 }, finish: null,
      spikes: [], springs: [], bouncers: [], teleIn: [], teleOut: {}, exits: [], labels: [],
      flips: [], rings: [], glue: [], pads: [], stars: [], starAt: {}, gates: [], buttons: [], doors: [],
      plats: [], arms: [], staplers: [], zones: [], period: 1, timed: false
    };
    var marks = { R: [], K: [], J: [], M: [], H: [], '!': [] };
    for (r = 0; r < L.h; r++) {
      for (c = 0; c < w; c++) {
        ch = rows[r][c];
        if (ch === ' ' || ch === '#') continue;
        if (ch >= '0' && ch <= '9') L.labels.push({ c: c, r: r, k: ch });
        else if (ch === 'P') L.start = { c: c, r: r };
        else if (ch === 'F') L.finish = { c: c, r: r };
        else if (ch === '*') { L.starAt[r + ',' + c] = L.stars.length; L.stars.push({ c: c, r: r }); }
        else if (ch === '^') L.spikes.push({ c: c, r: r, up: true });
        else if (ch === 'v') L.spikes.push({ c: c, r: r, up: false });
        else if (ch === 'S' || ch === 'T') L.springs.push({ c: c, r: r, low: false, trap: ch === 'T' });
        else if (ch === 'L' || ch === 'I') L.springs.push({ c: c, r: r, low: true, trap: ch === 'I' });
        else if (ch === ')' || ch === ']') L.bouncers.push({ c: c, r: r, side: 1, trap: ch === ']' });
        else if (ch === '(' || ch === '[') L.bouncers.push({ c: c, r: r, side: -1, trap: ch === '[' });
        else if (ch === 'U' || ch === 'V') L.flips.push({ c: c, r: r, to: -1, trap: ch === 'V' });
        else if (ch === 'N') L.flips.push({ c: c, r: r, to: 1, trap: false });
        else if (ch === 'O' || ch === 'Q') L.rings.push({ c: c, r: r, trap: ch === 'Q' });
        else if (ch === 'u') L.glue.push({ c: c, r: r });
        else if (ch === '+') L.pads.push({ c: c, r: r });
        else if (ch === '>' || ch === '<') L.gates.push({ c: c, r: r, dir: ch === '>' ? 1 : -1 });
        else if (ch === 'k' || ch === 'q') L.buttons.push({ c: c, r: r, bit: ch === 'k' ? 1 : 2 });
        else if (ch === 'g' || ch === 'r') L.doors.push({ c: c, r: r, bit: ch === 'g' ? 1 : 2 });
        else if (marks[ch]) marks[ch].push({ c: c, r: r });
        else if (TELE_IN.indexOf(ch) >= 0) L.teleIn.push({ c: c, r: r, k: ch, trap: 'wxyz'.indexOf(ch) >= 0 });
        else if (TELE_IN.indexOf(ch.toLowerCase()) >= 0 && ch !== ch.toLowerCase()) {
          L.teleOut[ch.toLowerCase()] = { c: c, r: r };
          L.exits.push({ c: c, r: r, k: ch.toLowerCase() });
        }
      }
      // pencil lines: each unbroken run in a row is one platform
      for (c = 0; c < w; c++) {
        if (rows[r][c] !== '=') continue;
        var c2 = c; while (c2 < w && rows[r][c2] === '=') c2++;
        L.plats.push({ x: c * T, y: r * T, w: (c2 - c) * T, van: true, mv: null });
        c = c2;
      }
    }
    var byCol = function (a, b) { return a.c - b.c || a.r - b.r; };
    var P = def.params || {};
    var per = function (p) { L.period = lcm(L.period, p); L.timed = true; return p; };
    marks.R.sort(byCol).forEach(function (m, n) {
      var p = (P.R && P.R[n]) || {};
      L.plats.push({ x: m.c * T, y: m.r * T, w: (p.w || 3) * T, van: false,
        mv: { dx: (p.dx || 0) * T, dy: (p.dy || 0) * T, period: per(p.period || 240), phase: p.phase || 0 } });
    });
    marks.K.sort(byCol).forEach(function (m, n) {
      var p = (P.K && P.K[n]) || {};
      L.arms.push({ px: (m.c + 0.5) * T, py: (m.r + 0.5) * T, len: (p.len || 2.2) * T, kind: 'spin',
        dir: p.dir || 1, period: per(p.period || 240), phase: p.phase || 0, group: 'K' + n });
    });
    marks.J.sort(byCol).forEach(function (m, n) {
      var p = (P.J && P.J[n]) || {};
      for (var sgn = -1; sgn <= 1; sgn += 2) {
        L.arms.push({ px: (m.c + 0.5) * T, py: (m.r + 1) * T - 3, len: (p.len || 2) * T, kind: 'swing', sign: sgn,
          min: (p.min == null ? 5 : p.min) * Math.PI / 180, max: (p.max == null ? 52 : p.max) * Math.PI / 180,
          period: per(p.period || 180), phase: p.phase || 0, group: 'J' + n });
      }
    });
    marks.M.sort(byCol).forEach(function (m, n) {
      var p = (P.M && P.M[n]) || {};
      L.staplers.push({ x: m.c * T, y: m.r * T, w: (p.w || 2) * T, h: 26, drop: (p.drop || 3) * T,
        period: per(p.period || 240), phase: p.phase || 0 });
    });
    marks.H.sort(byCol);
    for (i = 0; i + 1 < marks.H.length; i += 2) {
      var a = marks.H[i], b = marks.H[i + 1];
      L.zones.push({ x0: Math.min(a.c, b.c) * T, y0: Math.min(a.r, b.r) * T, x1: (Math.max(a.c, b.c) + 1) * T, y1: (Math.max(a.r, b.r) + 1) * T });
    }
    marks['!'].sort(byCol).forEach(function (m, n) {   // ink drips: fall from a blot to the ground, then reset
      var p = (P.D && P.D[n]) || {};
      L.staplers.push({ x: m.c * T + 8, y: m.r * T, w: T - 16, h: 22, drop: (p.drop || 5) * T, period: per(p.period || 180), phase: p.phase || 0, drip: true });
    });
    var B = def.boss;
    if (B) {
      L.boss = B.kind;
      if (B.chase) L.chase = { x0: L.start.c * T - B.chase * T, v: B.v || CFG.speed, amp: (B.amp || 0) * T, per: per(B.per || 240) };
      if (B.flip) { L.flipEvery = B.flip; per(B.flip * 2); if (L.finish) L.flipStop = (L.finish.c - 17) * T; }
    }
    L.vanInit = [];
    for (i = 0; i < L.plats.length; i++) L.vanInit.push(-1);

      }
      ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(cam.x - 40, top);
      for (let y = top; y <= bot; y += 20) ctx.lineTo(x + Math.sin(y / 23 + s.t / 14) * 14 + Math.sin(y / 61 - s.t / 25) * 22, y);
      ctx.lineTo(cam.x - 40, bot); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.35; ctx.beginPath();
      for (let y = top; y <= bot; y += 20) ctx.lineTo(x + 26 + Math.sin(y / 17 + s.t / 10) * 18, y);
      ctx.lineTo(cam.x - 40, bot); ctx.lineTo(cam.x - 40, top); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  function drawMovers() {
    const x0 = cam.x - 140, x1 = cam.x + W / S + 140, t = s.t;
    let i;
    for (i = 0; i < L.plats.length; i++) {
      const p = L.plats[i], px = E.platX(p, t), py = E.platY(p, t);
      if (px + p.w < x0 || px > x1) continue;
      if (p.van) {
        const touched = s.van[i] >= 0, age = touched ? (t - s.van[i]) / CFG.vanish : 0;
        if (age > 1) {   // erased: only rubber crumbs are left
          ctx.fillStyle = C.pencil; ctx.globalAlpha = 0.22; ctx.beginPath();
          for (let k = 0; k < p.w / 14; k++) { const cx = px + 6 + k * 14 + rnd(i, k, 4) * 6, cy = py + 3 + rnd(i, k, 5) * 5; ctx.moveTo(cx + 1.3, cy); ctx.arc(cx, cy, 1.3, 0, Math.PI * 2); }
          ctx.fill(); ctx.globalAlpha = 1; continue;
        }
        ctx.strokeStyle = C.pencil; ctx.globalAlpha = touched ? 1 - age * 0.75 : 1;
        if (touched) ctx.setLineDash([9, 5 + age * 10]);
        ctx.lineWidth = 3.4; ctx.beginPath(); seg(px + 1, py + 2, px + p.w - 1, py + 2, i * 7 + 500, 1); ctx.stroke();
        ctx.lineWidth = 1.2; ctx.beginPath(); seg(px + 3, py + 6.5, px + p.w - 3, py + 6.5, i * 7 + 501, 1); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;
      } else {         // ruler
        ctx.fillStyle = RULER; ctx.strokeStyle = C.pencil; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.rect(px, py, p.w, 10); ctx.fill(); ctx.stroke();
        ctx.lineWidth = 1; ctx.beginPath();
        for (let x = 6; x < p.w; x += 8) { ctx.moveTo(px + x, py); ctx.lineTo(px + x, py + ((x - 6) % 40 === 0 ? 6 : 3.5)); }
        ctx.stroke();
      }
    }
    const seen = {};
    for (i = 0; i < L.arms.length; i++) {
      const a = L.arms[i]; if (a.px + a.len < x0 || a.px - a.len > x1) continue;
      const th = E.armAngle(a, t), sn = Math.sin(th), cs = Math.cos(th), tx = a.px + sn * a.len, ty = a.py - cs * a.len;
      if (a.kind === 'spin') {   // the circle the compass is drawing
        ctx.strokeStyle = C.pencil; ctx.globalAlpha = 0.28; ctx.lineWidth = 1.2; ctx.setLineDash([4, 6]);
        ctx.beginPath(); ctx.arc(a.px, a.py, a.len, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = C.pencil; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(a.px + sn * a.len * 0.22, a.py - cs * a.len * 0.22); ctx.stroke();
      ctx.strokeStyle = C.red; ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.moveTo(a.px + sn * a.len * 0.22, a.py - cs * a.len * 0.22); ctx.lineTo(tx, ty); ctx.stroke();
      if (a.kind === 'spin') { ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, Math.PI * 2); ctx.fill(); }
      if (!seen[a.group]) {
        seen[a.group] = 1; ctx.fillStyle = C.paper; ctx.strokeStyle = C.pencil; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(a.px, a.py, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
    }
    for (i = 0; i < L.staplers.length; i++) {
      const m = L.staplers[i]; if (m.x + m.w < x0 || m.x > x1) continue;
      if (m.drip) { drawDrip(m, E.staplerY(m, t)); continue; }
      const sy = E.staplerY(m, t), n = Math.max(2, Math.floor((m.w - 10) / 9));
      ctx.strokeStyle = C.pencil; ctx.globalAlpha = 0.4; ctx.lineWidth = 1.3; ctx.beginPath();
      ctx.moveTo(m.x + 10, m.y - 14); ctx.lineTo(m.x + 10, sy); ctx.moveTo(m.x + m.w - 10, m.y - 14); ctx.lineTo(m.x + m.w - 10, sy);
      ctx.moveTo(m.x + 2, m.y - 14); ctx.lineTo(m.x + m.w - 2, m.y - 14); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = C.pencil; ctx.fillRect(m.x + 3, sy, m.w - 6, m.h - 6);
      ctx.strokeStyle = C.red; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(m.x + 5, sy + m.h - 6);
      for (let k = 1; k <= n; k++) ctx.lineTo(m.x + 5 + k * ((m.w - 10) / n), sy + m.h - (k % 2 ? 0 : 6));
      ctx.stroke();
    }
  }

  function drawLabels() {
    ctx.fillStyle = C.pencil; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    try { ctx.direction = 'ltr'; } catch (e) { /* ignore */ }
    ctx.font = '27px ' + FONT;
    for (let i = 0; i < L.labels.length; i++) {
      const l = L.labels[i], txt = L.texts[l.k]; if (!txt) continue;
      const x = l.c * T + T / 2, y = l.r * T + T / 2;
      if (x < cam.x - 400 || x > cam.x + W / S + 400) continue;
      ctx.save(); ctx.translate(x, y); ctx.rotate((rnd(l.c, l.r, 3) - 0.5) * 0.07);
      ctx.fillText(txt, 0, 0);
      const w = ctx.measureText(txt).width;
      ctx.strokeStyle = C.pencil; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.6; ctx.beginPath();
      seg(-w / 2 - 4, 19, w / 2 + 4, 21, l.c * 5 + l.r, 1.6); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawStains() {
    const list = stains[idx];
    ctx.fillStyle = PEN;
    for (let i = 0; i < list.length; i++) {
      const st = list[i];
      if (st.x < cam.x - 60 || st.x > cam.x + W / S + 60) continue;
      ctx.globalAlpha = 0.5; ctx.beginPath();
      for (let k = 0; k < st.blobs.length; k++) { const b = st.blobs[k]; ctx.moveTo(st.x + b[0] + b[2], st.y + b[1]); ctx.arc(st.x + b[0], st.y + b[1], b[2], 0, Math.PI * 2); }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHat(hat, hx, hy, d) {
    ctx.lineWidth = 2; ctx.lineJoin = 'round';
    if (hat === 'cap') {
      ctx.fillStyle = PEN; ctx.beginPath(); ctx.arc(hx, hy - 1.5, 6.8, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = PEN; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(hx, hy - 1.8); ctx.lineTo(hx + d * 11, hy - 0.8); ctx.stroke();
    } else if (hat === 'shades') {
      ctx.fillStyle = '#000'; ctx.strokeStyle = C.pencil; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.rect(Math.min(hx - d * 1.5, hx + d * 6.5), hy - 3, 8, 3.4); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx - d * 1.5, hy - 2.2); ctx.lineTo(hx - d * 6.2, hy - 1.2); ctx.stroke();
    } else if (hat === 'horns') {
      ctx.fillStyle = C.red;
      for (const sg of [-1, 1]) { ctx.beginPath(); ctx.moveTo(hx + sg * 2, hy - 5.6); ctx.quadraticCurveTo(hx + sg * 7, hy - 8, hx + sg * 6.5, hy - 13); ctx.lineTo(hx + sg * 5.5, hy - 4); ctx.closePath(); ctx.fill(); }
    } else if (hat === 'crown') {
      ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.moveTo(hx - 6.5, hy - 4.5);
      ctx.lineTo(hx - 7, hy - 12); ctx.lineTo(hx - 3.2, hy - 8); ctx.lineTo(hx, hy - 13.5); ctx.lineTo(hx + 3.2, hy - 8); ctx.lineTo(hx + 7, hy - 12); ctx.lineTo(hx + 6.5, hy - 4.5);
      ctx.closePath(); ctx.fill();
    } else if (hat === 'antenna') {
      ctx.strokeStyle = C.pencil; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(hx, hy - 6); ctx.quadraticCurveTo(hx - d * 3, hy - 11, hx - d * 1, hy - 15); ctx.stroke();
      ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(hx - d * 1, hy - 16, 2.6, 0, Math.PI * 2); ctx.fill();
    } else if (hat === 'tophat') {
      ctx.fillStyle = '#1a1d29'; ctx.strokeStyle = C.pencil; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.rect(hx - 5, hy - 15, 10, 10); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx - 9, hy - 5); ctx.lineTo(hx + 9, hy - 5); ctx.stroke();
      ctx.fillStyle = PEN; ctx.fillRect(hx - 5, hy - 8.5, 10, 2.2);
    } else if (hat === 'halo') {
      ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(hx, hy - 12, 7, 2.3, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function drawPlayer(o) {
    const main = !o && sq !== 0;
    o = o || { x: s.x, y: s.y, dir: s.dir, g: s.g, grounded: s.grounded, vy: s.vy, phase: runPhase };
    const d = o.dir, cx = o.x + CFG.pw / 2, top = o.y, sd = 9001, flipped = o.g < 0;
    if (flipped) { ctx.save(); ctx.translate(0, 2 * o.y + CFG.ph); ctx.scale(1, -1); }
    if (main) { const fy = top + CFG.ph; ctx.save(); ctx.translate(cx, fy); ctx.scale(1 - sq * 0.22, 1 + sq * 0.28); ctx.translate(-cx, -fy); }
    const lean = d * 2.2, headY = top + 6, sh = top + 15, hip = top + 23;
    let l1, l2, a1, a2, legLen = 11;
    if (o.grounded) {
      const a = Math.sin(o.phase) * 0.95;
      l1 = a; l2 = -a; a1 = -a * 0.9; a2 = a * 0.9;
    } else if (o.vy * o.g < 0) { l1 = 0.95; l2 = -0.45; a1 = 2.5; a2 = -2.3; legLen = 10; }
    else { l1 = 0.6; l2 = -0.6; a1 = 2.05; a2 = -2.05; }
    ctx.strokeStyle = PEN; ctx.lineWidth = 2.9; ctx.lineCap = 'round';
    ctx.beginPath();
    seg(cx + lean, sh - 3, cx, hip, sd, 0.4);
    seg(cx, hip, cx + Math.sin(l1) * legLen * d, hip + Math.cos(l1) * legLen, sd + 1, 0.4);
    seg(cx, hip, cx + Math.sin(l2) * legLen * d, hip + Math.cos(l2) * legLen, sd + 2, 0.4);
    const ax = cx + lean * 0.7, ay = sh;
    seg(ax, ay, ax + Math.sin(a1) * 9 * d, ay + Math.cos(a1) * 9, sd + 3, 0.4);
    seg(ax, ay, ax + Math.sin(a2) * 9 * d, ay + Math.cos(a2) * 9, sd + 4, 0.4);
    ctx.stroke();
    const hx = cx + lean + jit(sd, 9, 0.3), hy = headY + jit(sd, 10, 0.3);
    ctx.fillStyle = C.paper; ctx.beginPath();
    ctx.arc(hx, hy, 6.2, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = PEN; ctx.beginPath(); ctx.arc(cx + lean + d * 2.6, headY - 0.6, 1.15, 0, Math.PI * 2); ctx.fill();
    drawHat(o.hat || store.skin.hat, hx, hy, d);
    if (main) ctx.restore();
    if (flipped) ctx.restore();
  }
  // a doodle on its own little canvas (skin picker)
  function doodleIcon(cv, hat, pen, run, sc) {
    sc = sc || 1.05;
    const r = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth || 56, h = cv.clientHeight || 56;
    cv.width = w * r; cv.height = h * r;
    const keep = ctx, keepPen = PEN; ctx = cv.getContext('2d'); PEN = pen;
    ctx.setTransform(r * sc, 0, 0, r * sc, 0, 0);
    drawPlayer({ x: w / sc / 2 - CFG.pw / 2, y: h / sc - CFG.ph - 3, dir: 1, g: 1, grounded: true, vy: 0, phase: run || 0.7, hat: hat });
    ctx = keep; PEN = keepPen;
  }


  function draw(dt) {
    const vw = W / S, vh = H / S;
    drawPaper(vw, vh);
    drawZones();
    const c0 = Math.floor(cam.x / T) - 1, c1 = Math.floor((cam.x + vw) / T) + 1;
    const r0 = Math.floor(cam.y / T) - 1, r1 = Math.floor((cam.y + vh) / T) + 1;
    // doodles
    ctx.strokeStyle = C.pencil; ctx.globalAlpha = 0.09;
    for (let i = 0; i < L.doodles.length; i++) { const d = L.doodles[i]; if (d.c >= c0 - 6 && d.c <= c1 + 6) drawDoodle(d); }
    ctx.globalAlpha = 1;
    drawBossBack(vw, vh);
    drawStains();
    drawTerrain(c0, c1, r0, r1);
    drawLabels();
    drawObjects(c0, c1, r0, r1);
    drawMovers();
    // teleport zip line
    for (let i = zips.length - 1; i >= 0; i--) {
      const z = zips[i]; z.t += dt; if (z.t > 0.45) { zips.splice(i, 1); continue; }
      ctx.strokeStyle = z.col; ctx.globalAlpha = 0.7 * (1 - z.t / 0.45); ctx.lineWidth = 2.2; ctx.setLineDash([7, 8]);
      ctx.beginPath(); ctx.moveTo(z.fx, z.fy); ctx.lineTo(z.tx, z.ty); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // glue strands: stretch from the puddle to the feet, then snap into drops
    for (let i = goo.length - 1; i >= 0; i--) {
      const q = goo[i]; q.t += dt;
      const fx = s.x + CFG.pw / 2, fy = q.up ? s.y : s.y + CFG.ph;
      if (q.t > 0.2 || s.dead) {
        for (let k = 0; k < 6; k++) parts.push({ x: q.x + (fx - q.x) * Math.random(), y: q.y + (fy - q.y) * Math.random(), vx: (Math.random() - 0.5) * 120, vy: (q.up ? -1 : 1) * 40, r: 1.5 + Math.random() * 1.8, life: 0.45, col: GLUE });
        goo.splice(i, 1); continue;
      }
      const k1 = q.t / 0.2;
      ctx.strokeStyle = GLUE; ctx.globalAlpha = 1 - k1 * 0.4;
      for (let k = 0; k < q.n; k++) {
        const off = (k - (q.n - 1) / 2) * 6, bx = q.x - 10 + off * 1.6, tx = fx + off * 0.5;
        const mx = (bx + tx) / 2 + Math.sin(q.sd + k * 2.3) * 5, my = (q.y + fy) / 2;
        ctx.lineWidth = Math.max(0.6, 3.2 * (1 - k1) - k * 0.3);
        ctx.beginPath(); ctx.moveTo(bx, q.y); ctx.quadraticCurveTo(mx, my, tx, fy); ctx.stroke();
      }
      ctx.fillStyle = GLUE; ctx.beginPath(); ctx.ellipse(fx, fy, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // pen trail
    if (trail.length > 2 && !s.dead) {
      ctx.strokeStyle = PEN; ctx.lineWidth = 1.3;
      for (let i = 1; i < trail.length; i++) {
        ctx.globalAlpha = 0.22 * i / trail.length;
        ctx.beginPath(); ctx.moveTo(trail[i - 1][0], trail[i - 1][1]); ctx.lineTo(trail[i][0], trail[i][1]); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    drawBossFront(vw, vh);
    if (s.boost > 0 && !s.dead) {
      ctx.strokeStyle = PADC; ctx.globalAlpha = 0.75; ctx.lineWidth = 2; ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const yy = s.y + 5 + k * 8, len = 12 + rnd(k, Math.floor(clock * 20), 3) * 24, bx = s.dir > 0 ? s.x - 6 : s.x + CFG.pw + 6;
        ctx.moveTo(bx, yy); ctx.lineTo(bx - s.dir * len, yy);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    sq *= Math.exp(-dt * 11); if (Math.abs(sq) < 0.02) sq = 0;
    for (let i = floats.length - 1; i >= 0; i--) {
      const q = floats[i]; q.t += dt;
      if (q.t > 0.75) { floats.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, (0.75 - q.t) * 4); ctx.fillStyle = q.col;
      ctx.font = (q.big ? 22 + q.big * 3 : 20) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(q.text, q.x, q.y - q.t * 46); ctx.globalAlpha = 1;
    }
    if (!s.dead && !(s.won && wonT < 0.45)) drawPlayer();
    // ink drops
    ctx.fillStyle = C.ink;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.fillStyle = p.col || PEN; ctx.globalAlpha = Math.min(1, p.life * 3); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- loop ---------- */
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000) || 0); last = now;
    clock += dt;
    if (!reduce) boil = Math.floor(clock * 6);
    if (screen === 'play') {
      acc += dt * (slowT > 0 ? 0.4 : 1); if (slowT > 0) slowT -= dt;
      let guard = 0;
      while (acc >= CFG.dt && guard++ < 24) { tick(); acc -= CFG.dt; }
      if (acc > CFG.dt) acc = 0;
      if (s.won && wonT >= 0) { wonT -= dt; if (wonT <= 0) { wonT = -1; finishLevel(); } }
    }
    if (screen !== 'menu') {
      // pull the camera back a little on a speed burst or a big jump
      const zt = reduce || screen !== 'play' || s.dead ? 1 : s.boost > 0 ? 0.9 : (!s.grounded && Math.abs(s.y + CFG.ph - cam.focusY) > 2.4 * T ? 0.94 : 1);
      zoom += (zt - zoom) * (1 - Math.exp(-dt * 2.2)); S = S0 * zoom;
      const t = camTarget();
      const kx = cam.boost > 0 ? 16 : 6, ky = cam.boost > 0 ? 16 : 5;
      cam.x += (t[0] - cam.x) * (1 - Math.exp(-dt * kx));
      cam.y += (t[1] - cam.y) * (1 - Math.exp(-dt * ky));
      if (cam.boost > 0) cam.boost -= dt;
      if (cam.shake > 0) cam.shake -= dt;
    }
    draw(dt);
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  function press(on) { if (screen === 'play') { if (on) { audio(); queued = true; } pressed = on; } else { pressed = false; queued = false; } }
  stage.addEventListener('pointerdown', (e) => {
    if (screen !== 'play' || (e.target && e.target.closest && e.target.closest('button,label,input'))) return;
    e.preventDefault(); press(true);
  });
  window.addEventListener('pointerup', () => press(false));
  window.addEventListener('pointercancel', () => press(false));
  window.addEventListener('blur', () => press(false));
  stage.addEventListener('contextmenu', (e) => { if (screen === 'play') e.preventDefault(); });
  const JUMP_KEYS = { Space: 1, ArrowUp: 1, KeyW: 1, KeyX: 1 };
  window.addEventListener('keydown', (e) => {
    if (screen === 'play') {
      if (JUMP_KEYS[e.code]) { e.preventDefault(); if (!e.repeat) press(true); }
      else if (e.code === 'Escape') showMenu();
      else if (e.code === 'KeyR') { respawn(); }
    } else if (screen === 'won' && e.code === 'Escape') showMenu();
  });
  window.addEventListener('keyup', (e) => { if (JUMP_KEYS[e.code]) press(false); });

  $('btn-menu').addEventListener('click', () => showMenu());
  $('menu-back').addEventListener('click', () => { menuWorld = -1; buildMenu(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { inZone = false; underwater(false); } });
  $('btn-endless').addEventListener('click', () => { audio(); startEndless(); });
  $('btn-skins').addEventListener('click', () => { audio(); menuWorld = -2; buildMenu(); });
  $('btn-next').addEventListener('click', () => { if (tooSoon()) return; audio(); if (endless) { startEndless(); return; } if (idx === WORLDS[wOf(idx)][WORLDS[wOf(idx)].length - 1] || (!OPEN_ALL && LEVELS[idx + 1].boss && passed(wOf(idx)) < 19)) showMenu(); else startLevel(idx + 1); });
  $('btn-again').addEventListener('click', () => { if (tooSoon()) return; audio(); startLevel(idx); });
  $('btn-list').addEventListener('click', () => { if (!tooSoon()) showMenu(); });
  $('sound').addEventListener('change', (e) => { store.muted = !e.target.checked; save(); if (!store.muted) sfx.jump(); else { inZone = false; underwater(false); } });
  $('music').addEventListener('change', (e) => { store.music = e.target.checked; save(); });
  $('dark').addEventListener('change', (e) => {
    DARK = e.target.checked; store.dark = DARK; save();
    document.documentElement.dataset.theme = DARK ? 'dark' : 'light';
    readColors(); themeColors(); PENS[0].col = C.ink; applySkin(); buildMenu();
  });

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------- boot (keeps your place across a republish) ---------- */
  function start(data) {
    resize();
    LEVELS.forEach(prep);
    if (document.fonts && document.fonts.load) { try { document.fonts.load('27px ' + FONT, 'tap').catch(function () {}); } catch (e) { /* ignore */ } }
    const firstOpen = LEVELS.findIndex((lv) => !store.done[lv.id]);
    idx = firstOpen < 0 ? 0 : firstOpen; L = LEVELS[idx]; s = E.newState(L); camSnap();
    if (data && data.screen === 'play' && typeof data.level === 'number') startLevel(data.level);
    else showMenu(-1);
    last = performance.now();
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(() => ({ screen: screen === 'menu' ? 'menu' : 'play', level: idx })); } catch (e) { /* ignore */ } }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
